# dataset
dataset: "reaction"

data_path: "/path/to/datasets/preprocess_ffs/train/videos/" # s
pretrained_model_path: "/import/nobackup_mmv_ioannisp/zs003/code/face_reaction/latte_reaction/pretrained_models/"

# save and load
results_dir: "./results"
pretrained:

# model config: 
# model: Latte-XL/2
model: Latte-S/2
num_frames: 32 #16
image_size: 256 # choices=[256, 512]
# num_sampling_steps: 250
frame_interval: 3
fixed_spatial: False
attention_bias: True
learn_sigma: True # important
extras: 3 # [1, 2] 1 unconditional generation, 2 class-conditional generation, 3 facial reaction condition

# train config:
save_ceph: True # important
learning_rate: 1e-4
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 20000
local_batch_size: 2 # important 5
max_train_steps: 1000000
global_seed: 3407
num_workers: 8
log_every: 100
lr_warmup_steps: 0
resume_from_checkpoint:
gradient_accumulation_steps: 1 # TODO
num_classes:

# low VRAM and speed up training
use_compile: False
mixed_precision: True
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: False

use_fp16: False

# sample config:
# seed:
sample_method: 'ddim'  #ddim 20;  ddpm 250
num_sampling_steps: 20
cfg_scale: 1.0
negative_name:

# ddp sample config
per_proc_batch_size: 2
num_fvd_samples: 2048
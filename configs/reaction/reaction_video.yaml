# Dataset root: train/{audio,video-face-crop,ZL_crop_test,facial-attributes}/
dataset: reaction
data_path: /path/to/dataset
fps: 30

# The VAE is loaded from pretrained_model_path/vae/.
pretrained_model_path: ./pretrained_models
results_dir: ./results
pretrained: null

model: Latte-B/4
num_frames: 64
image_size: 256
frame_interval: 3
learn_sigma: true
extras: 3
num_classes: null

learning_rate: 1.0e-4
local_batch_size: 8
max_train_steps: 1000000
global_seed: 3407
num_workers: 12
log_every: 100
ckpt_every: 10000
clip_max_norm: 0.1
start_clip_iter: 20000

resume_from_checkpoint: false
resume_ckpt_path: null
